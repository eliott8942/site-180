{{ define "main" }}
  <section class="relative section-sm !pt-0 overflow-x-hidden">
    <div class="w-full flex justify-end mb-4">
      <a 
        class="m-2 bg-white rounded-full border text-xl flex items-center text-dark dark:text-white lg:order-1 w-fit p-3 shadow-md hover:scale-110" 
        href="{{ "events/past-events" | relURL }}"
        aria-label="Return"
      > 
        <i class="fa-solid fa-clock-rotate-left"></i>
      </a>
    </div>
    
    <div class="relative container text-center section-pb z-20">
      <h1>{{ .Title | title }}</h1>
    </div>
  </section>
{{ end }}
