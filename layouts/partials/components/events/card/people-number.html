{{ $cancelled := eq .status "cancelled" }}

<div class="flex flex-col items-center {{ if $cancelled }} bg-[#a9daef] {{ else }} bg-sky-400 {{ end }} rounded-sm shadow-md pt-2">
  <div class="bg-white py-1 px-2 rounded-sm">
    <div class="text-2xl font-semibold {{ if $cancelled }} opacity-75 {{ end }}">
      <i class="text-lg fa-solid fa-users"></i> {{ .number }}
    </div>
  </div>
</div>
