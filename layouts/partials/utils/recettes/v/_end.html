{{ $page := .Page }}
{{ $systems := $page.Store.Get "vSystems" | default slice }}

{{ if $systems }}
  <script>
    {{ $init := dict }}
  
    {{ range $id := $systems }}
      {{ $cfg := $page.Store.Get (print $id "Config") }}
      {{ $entry := dict }}
  
      {{ with $cfg.numberOfValues }}
        {{ $ids := slice }}
        {{ range seq . }}
          {{ $ids = $ids | append (printf "%s-%d" $cfg.idPrefix (sub . 1)) }}
        {{ end }}
        {{ $entry = merge $entry (dict "elements" $ids) }}
      {{ end }}
  
      {{/* numeric fields: keep a legitimate 0 */}}
      {{ range $k := slice "baseValue" "min" "max" }}
        {{ if isset $cfg $k }}
          {{ $entry = merge $entry (dict $k (index $cfg $k)) }}
        {{ end }}
      {{ end }}
  
      {{ with $cfg.dependents }}
        {{ $entry = merge $entry (dict "dependents" .) }}
      {{ end }}
  
      {{ with $cfg.dependencies }}
        {{ $vars := slice }}
        {{ range . }}
          {{ $vars = $vars | append (partial "utils/strings/kebab-to-camel-case" .) }}
        {{ end }}
        {{ $entry = merge $entry (dict "dependencies" . "expressionVariables" $vars) }}
      {{ end }}
  
      {{ with $cfg.code }}
        {{ $entry = merge $entry (dict "expression" .) }}
      {{ end }}
  
      {{ $init = merge $init (dict $id $entry) }}
    {{ end }}
  
    initVSystems({{ $init | jsonify | safeJS }});
  </script>
{{ end }}

{{ warnf "INFO %s registered v systems : %s" .Position $systems }}
