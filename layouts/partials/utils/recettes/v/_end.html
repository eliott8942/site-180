{{ $page := .Page }}
{{ $allSystems := $page.Store.Get "vSystems" }}

{{ if $allSystems }}
<script defer>
  {{ range $id := $page.Store.Get "vSystems" }}
    {{ $valueConfigIdent := print $id "Config" }}
    {{ $vSystemInfo := $page.Store.Get $valueConfigIdent }}

    {{ $arrayName := print $vSystemInfo.idPrefix "_IDS" | upper }}

    {{ if isset $vSystemInfo "numberOfValues" }}
      {{ if ne $vSystemInfo.numberOfValues 0 }}
        const {{ $arrayName | safeJS }} = [
          {{ range $i, $id := seq 0 (sub $vSystemInfo.numberOfValues 1) }}
            {{ if ne $i 0 }}
              ,
            {{ end }}
          
            {{ print $vSystemInfo.idPrefix "-" $id }}
          {{ end }}
        ];
      {{ end }}
    {{ end }}
  {{ end }}

  {{ range $id := $page.Store.Get "vExpr" }}
    {{ $valueConfigIdent := print $id "Config" }}
    {{ $vSystemInfo := $page.Store.Get $valueConfigIdent }}

    {{ $arrayName := print $vSystemInfo.idPrefix "_IDS" | upper }}

    {{ if isset $vSystemInfo "numberOfValues" }}
      {{ if ne $vSystemInfo.numberOfValues 0 }}
        const {{ $arrayName | safeJS }} = [
          {{ range $i, $id := seq 0 (sub $vSystemInfo.numberOfValues 1) }}
            {{ if ne $i 0 }}
              ,
            {{ end }}
          
            {{ print $vSystemInfo.idPrefix "-" $id }}
          {{ end }}
        ];
      {{ end }}
    {{ end }}
  {{ end }}

  registerVSystems(
    {
      {{ range $i, $id := $page.Store.Get "vSystems" }}
        {{ $arrayName := print $id "_IDS" | upper }}
  
        {{ $valueConfigIdent := print $id "Config" }}
        {{ $vSystemInfo := $page.Store.Get $valueConfigIdent }}
  
        {{ if ne $i 0 }}
          ,
        {{ end }}
  
        {{ $id }}: {
          {{ if ne $vSystemInfo.numberOfValues 0 }}
            elements: {{ $arrayName | safeJS }},
          {{ end }}

          {{ with $vSystemInfo.baseValue }}
            baseValue: {{ . | safeJS }},
          {{ end }}

          {{ with $vSystemInfo.min }}
            min: {{ . | safeJS }},
          {{ end }}
  
          {{ with $vSystemInfo.max }}
            max: {{ . | safeJS }},
          {{ end }}
          
          {{ with $vSystemInfo.dependents }}
            {{ if ne (len . ) 0 }}
              dependents: [
                {{ range $i, $id := . }}
                  {{ if ne $i 0 }}
                    ,
                  {{ end }}
                
                  {{ . }}
                {{ end }}
              ],
            {{ end }}
          {{ end }}

          {{ with $vSystemInfo.dependencies }}
            {{ if ne (len . ) 0 }}
              dependencies: [
                {{ range $i, $id := . }}
                  {{ if ne $i 0 }}
                    ,
                  {{ end }}
                
                  {{ . }}
                {{ end }}
              ],
            
              expressionVariables: [
                {{ range $i, $id := . }}
                  {{ if ne $i 0 }}
                    ,
                  {{ end }}
                
                  {{ partial "utils/strings/kebab-to-camel-case" . }}
                {{ end }}
              ],
            {{ end }}
          {{ end }}

          {{ with $vSystemInfo.code }}
            expression: {{ . }},
          {{ end }}
        }
      {{ end }}
    }
  );
</script>
{{ end }}

{{ warnf "INFO %s registered v systems : %s" .Position (.Page.Store.Get "vSystems") }}
