{{ $link := .Get "link" }}
{{ $content := .Get "content" }}

<div class="flex w-full items-center justify-center py-5">
  <a 
    href="{{ $link }}" 
    class="not-prose btn text-2xl"
    {{ if partial "utils/url/is-external" $link }}
      target="_blank" rel="noreferrer"
    {{ end }}
  > 
    {{ $content }} 
  </a>
</div>
