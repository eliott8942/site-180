<!-- 
  To explain a little what's going on : We need to rerender in order
  all the shortcodes related to the v system to maintain data consistency,
  but logically, when we modify one of it's shortcode, it will only
  rerender that one, not everything.

  So we need to make them call a dispatch partial, that in turns call
  the specific partial associated to the command we want to do. That
  way, if we need to modify the logic of one of the commands, we
  force all the shortcodes that depend on the dispatch to be rerendered.

  Combined with the fact that currently hugo renders shortcode in order,
  we garantee that the commands are rexecuted in order consistently.
-->
{{ partial "utils/recettes/v" (dict "command" "add" "context" .) }}
